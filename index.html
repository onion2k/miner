<!doctype html>
<meta charset="utf-8" />
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
/>
<title>Pushminer</title>
<!-- inline, so the browser does not go asking for a /favicon.ico there is none of -->
<link
  rel="icon"
  href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23f0a020'/%3E%3Ccircle cx='8' cy='8' r='4.5' fill='none' stroke='%23b86a08' stroke-width='1.2'/%3E%3C/svg%3E"
/>
<style>
  :root {
    color-scheme: dark;
    --ink: #f1eee6;
    --dim: #a39f94;
    --gold: #f2c14e;
  }
  * {
    box-sizing: border-box;
  }
  html,
  body {
    margin: 0;
    height: 100%;
    background: #0b0a10;
    overflow: hidden;
  }
  body {
    font:
      14px/1.5 ui-rounded,
      'SF Pro Rounded',
      system-ui,
      sans-serif;
    color: var(--ink);
  }
  #stage {
    position: fixed;
    inset: 0;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  .panel {
    position: fixed;
    padding: 10px 14px;
    background: rgba(14, 12, 20, 0.62);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    backdrop-filter: blur(8px);
    pointer-events: none;
  }
  #bank {
    top: 16px;
    left: 16px;
    font-size: 15px;
  }
  #bank b {
    display: block;
    font-size: 30px;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
  }
  #bank .sub {
    color: var(--dim);
    font-size: 13px;
  }
  #stats {
    top: 16px;
    right: 16px;
    text-align: right;
    color: var(--dim);
    font-size: 12px;
  }
  #stats span {
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  #help {
    bottom: 16px;
    left: 16px;
    color: var(--dim);
    font-size: 13px;
  }
  /* a key that is only there once what it works is bought: said in the line's own weight */
  #help b {
    font-weight: inherit;
  }
  #help span {
    color: var(--ink);
    background: rgba(255, 255, 255, 0.1);
    border-radius: 5px;
    padding: 0 6px;
  }
  /* the combo tally: grows with the run, and fades when the run is over */
  #toast {
    bottom: 84px;
    left: 50%;
    transform: translateX(-50%);
    color: var(--gold);
    font-weight: 800;
    font-size: 18px;
    transition:
      opacity 0.5s,
      font-size 0.15s;
    text-align: center;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
    padding: 8px 18px;
  }
  #toast small {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: var(--dim);
    margin-top: 4px;
  }
  #toast.gone {
    opacity: 0;
  }
  /* the black the cave goes to down the way out and comes out of down the way in, over the whole page: its
     opacity is the game's darkness, set every frame, so it is never on a clock */
  #fade {
    position: fixed;
    inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
    z-index: 6;
  }
  /* "Keep going", in the middle of the screen above the black, so the player drives on into the dark and not to
     a stop in it: its opacity is the game's, set every frame, rising as the way out goes dark and falling as the
     next cave comes up. It takes no touches, and sits above the map and the controls' reach. */
  #keepGoing {
    position: fixed;
    left: 50%;
    top: 42%;
    transform: translate(-50%, -50%);
    z-index: 8;
    color: #f2c14e;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    white-space: nowrap;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
    opacity: 0;
    pointer-events: none;
  }
  @media (max-width: 480px) {
    #keepGoing {
      font-size: 22px;
    }
  }
  /* above the black, so what is said on coming into a cave is read in the dark it comes out of; the line
     breaks in it are its name, what is in it, and what was left behind */
  #cameraNote {
    z-index: 7;
    white-space: pre-line;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    color: var(--dim);
    font-size: 13px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    width: max-content;
    max-width: calc(100vw - 32px);
    text-align: center;
  }
  #shop {
    top: 50%;
    right: 16px;
    transform: translateY(-50%);
    pointer-events: auto;
    width: 320px;
  }
  #shop[hidden] {
    display: none;
  }
  #shop h2 {
    margin: 0 0 8px;
    font-size: 13px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--dim);
  }
  /* the bank, in the shop's heading: only on a phone, where the counter in the corner is hidden */
  #shop h2 .balance {
    display: none;
    float: right;
    letter-spacing: 0.08em;
  }
  #shop h2 .balance b {
    color: var(--gold);
    font-size: 16px;
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
    margin-left: 4px;
  }
  body.touch #shop h2 .balance {
    display: inline;
  }
  #shop .rows {
    display: grid;
    gap: 6px;
  }
  #shop button {
    font: inherit;
    text-align: left;
    color: var(--ink);
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 8px;
    padding: 6px 10px;
    cursor: pointer;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px;
    align-items: center;
  }
  #shop button:hover:not(:disabled) {
    background: rgba(255, 255, 255, 0.14);
  }
  #shop button:disabled {
    opacity: 0.45;
    cursor: default;
  }
  #shop button small {
    display: block;
    color: var(--dim);
    font-size: 12px;
  }
  #shop button .cost {
    color: var(--gold);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  #shop button.owned .cost {
    color: #7ee2a0;
  }
  #shop button.active {
    border-color: var(--gold);
  }
  #shop h2.later {
    margin-top: 12px;
  }
  /* At a desk the whole workshop is on the screen at once, with nothing to scroll: a list that scrolled hid
     the conveyor and the drones under the fold. Its rows are small, and the paint shop's, which all say much
     the same under their names, stand two to a line with those words left to the tooltip. Only a window
     too short for even that scrolls, and then as one panel. */
  body:not(.touch) #shop {
    width: 360px;
    max-height: calc(100vh - 24px);
    overflow: auto;
  }
  body:not(.touch) #shop .rows {
    gap: 4px;
  }
  body:not(.touch) #shop button {
    padding: 4px 9px;
    font-size: 13px;
    line-height: 1.25;
  }
  body:not(.touch) #shop button small {
    font-size: 12px;
  }
  body:not(.touch) #shop .rows.cosmetics {
    grid-template-columns: 1fr 1fr;
  }
  body:not(.touch) #shop .rows.cosmetics small {
    display: none;
  }
  #shop .foot {
    margin-top: 8px;
    color: var(--dim);
    font-size: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #shop .foot button {
    display: inline;
    padding: 2px 8px;
    font-size: 12px;
  }
  #shop .foot button.armed {
    background: #c0392b;
    border-color: #e74c3c;
    color: #fff;
  }
  /* ---- on a phone: a slider each side for each track, a row of buttons between, and no keyboard help.
     Kept small and see-through: on a 412 by 915 phone the first version's sliders and buttons covered
     nearly half the cave. A slider's hit area is wider than what is drawn of it. ---- */
  #pad,
  #tracks {
    display: none;
  }
  body.touch {
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  /* the counters at the top and the keyboard help: on a phone the cave gets the screen */
  body.touch #help,
  body.touch .keys,
  body.touch #bank,
  body.touch #stats {
    display: none;
  }
  body.touch #tracks:not([hidden]) {
    display: block;
  }
  body.touch #pad:not([hidden]) {
    display: flex;
  }
  /* the buttons, in one row at the bottom between the sliders: mute, shop, and the horn and the scoop once they are bought */
  #pad {
    position: fixed;
    bottom: calc(14px + env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%);
    gap: 10px;
    align-items: center;
  }
  #pad button {
    font: inherit;
    color: var(--ink);
    background: rgba(14, 12, 20, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.16);
    backdrop-filter: blur(8px);
    touch-action: none;
    height: 40px;
    padding: 0;
  }
  #pad button[hidden] {
    display: none;
  }
  #pad button:active {
    background: rgba(242, 193, 78, 0.25);
  }
  #hornButton,
  #scoopButton,
  #tipButton,
  #muteButton,
  #cameraButton,
  #controlsButton {
    width: 40px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-size: 18px;
    line-height: 1;
  }
  #controlsButton {
    font-size: 14px;
    letter-spacing: -0.1em;
  }
  #hornButton,
  #scoopButton,
  #tipButton {
    border-color: rgba(242, 193, 78, 0.45);
  }
  #shopButton {
    padding: 0 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--gold);
    border-color: rgba(242, 193, 78, 0.45);
  }
  /* A slider is sized from the screen: 8% of its short side across, a quarter of the height
     standing up and the whole height lying down. What is drawn is the rail; ::before reaches
     past it either side, invisibly, so a thumb need not land on a bar that thin. */
  .track {
    position: fixed;
    bottom: calc(12px + env(safe-area-inset-bottom));
    width: 8vmin;
    height: 26vh;
    border-radius: 4vmin;
    background: rgba(14, 12, 20, 0.32);
    border: 1px solid rgba(255, 255, 255, 0.12);
    touch-action: none;
  }
  @media (orientation: landscape) {
    .track {
      top: calc(8px + env(safe-area-inset-top));
      bottom: calc(8px + env(safe-area-inset-bottom));
      height: auto;
    }
  }
  #trackLeft {
    left: calc(3vmin + env(safe-area-inset-left));
  }
  #trackRight,
  #steer {
    right: calc(3vmin + env(safe-area-inset-right));
  }
  .track::before {
    content: '';
    position: absolute;
    top: 0;
    bottom: 0;
    left: -3vmin;
    right: -3vmin;
  }
  /* the tick at the middle, where the lever rests */
  .track::after {
    content: '';
    position: absolute;
    left: 20%;
    right: 20%;
    top: 50%;
    height: 2px;
    background: rgba(255, 255, 255, 0.25);
  }
  .track[hidden] {
    display: none;
  }
  /* the steering, lying across on the right: it stands on the row of buttons, clear of them at any width */
  .track.across {
    top: auto;
    bottom: calc(64px + env(safe-area-inset-bottom));
    height: 8vmin;
    width: min(44vw, 320px);
  }
  .track.across::before {
    top: -3vmin;
    bottom: -3vmin;
    left: 0;
    right: 0;
  }
  .track.across::after {
    top: 20%;
    bottom: 20%;
    left: 50%;
    right: auto;
    width: 2px;
    height: auto;
  }
  .track.across .thumb {
    top: 2px;
    bottom: 2px;
    left: calc(50% - 4vmin);
    width: 8vmin;
    height: auto;
  }
  body.touch.stick #toast {
    bottom: calc(76px + 8vmin + env(safe-area-inset-bottom));
  }
  .track .thumb {
    position: absolute;
    left: 2px;
    right: 2px;
    top: calc(50% - 4vmin);
    height: 8vmin;
    border-radius: 4vmin;
    z-index: 1;
    background: rgba(242, 193, 78, 0.6);
    box-shadow: 0 1px 6px rgba(0, 0, 0, 0.4);
    transition: transform 0.18s ease-out;
  }
  .track.held .thumb {
    transition: none;
    background: var(--gold);
  }
  body.touch #shop {
    right: 50%;
    width: min(340px, calc(100vw - 24px));
    z-index: 5;
  }
  /* clear of the counters above and the buttons below, so the button that closes it is never under it */
  /* It stands on the buttons and grows upward, so it is held to the height left above them and scrolls
     as one list, the heading with the balance staying put: two lists each a share of the screen grew
     past the top of a short phone and took the workshop with them. */
  body.touch #shop {
    top: auto;
    bottom: calc(66px + env(safe-area-inset-bottom));
    transform: translateX(50%);
    max-height: calc(100vh - 74px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
    max-height: calc(100dvh - 74px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
    overflow: auto;
    touch-action: pan-y;
    padding-top: 0;
  }
  body.touch #shop .rows {
    max-height: none;
    overflow: visible;
  }
  body.touch #shop h2:first-child {
    position: sticky;
    top: 0;
    z-index: 1;
    margin: 0;
    padding: 10px 0 8px;
    background: rgb(22, 20, 28);
  }
  body.touch #toast {
    bottom: calc(66px + env(safe-area-inset-bottom));
  }
  /* where to go: a map of the cave round the machine, turned so that up is up the screen. It is above the
     black of the fade, and fades by the same darkness itself, so it goes with the cave and not twice as fast.
     Drawn by the page and never touched: a tap on it is a tap on the cave. */
  #minimap {
    right: 16px;
    bottom: 16px;
    width: 120px;
    height: 120px;
    padding: 0;
    overflow: hidden;
    z-index: 8;
  }
  #minimap[hidden] {
    display: none;
  }
  #minimap.covered {
    visibility: hidden;
  }
  /* on a phone, in the top-right corner inside the notch and the rounded screen, where the counters are not */
  body.touch {
    --map-right: calc(12px + env(safe-area-inset-right));
  }
  /* turned on its side the right-hand slider runs the height of the screen, hit area and all: the map keeps off it */
  @media (orientation: landscape) {
    body.touch:not(.stick) {
      --map-right: calc(14vmin + 8px + env(safe-area-inset-right));
    }
  }
  body.touch #minimap {
    top: calc(12px + env(safe-area-inset-top));
    right: var(--map-right);
    bottom: auto;
    width: 88px;
    height: 88px;
    border-radius: 10px;
  }
  /* the word at the top keeps to the room the map leaves it, and is centred in that */
  body.touch #cameraNote {
    left: 12px;
    right: calc(var(--map-right) + 88px + 8px);
    transform: none;
    margin: 0 auto;
    max-width: calc(100vw - 12px - var(--map-right) - 88px - 8px);
  }
  #boot {
    position: fixed;
    inset: 0;
    display: grid;
    place-content: center;
    gap: 12px;
    text-align: center;
    background: #0b0a10;
    transition: opacity 0.5s;
    z-index: 10;
  }
  #boot.gone {
    opacity: 0;
    pointer-events: none;
  }
  #boot h1 {
    margin: 0;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.3em;
    color: var(--gold);
  }
  #boot p {
    margin: 0;
    color: var(--dim);
  }
</style>
<div id="stage"><canvas id="view"></canvas></div>
<div id="fade"></div>
<div id="keepGoing" aria-hidden="true">Keep going</div>
<div class="panel" id="bank" hidden><b>0</b><span class="sub" id="progress"></span></div>
<div class="panel" id="stats" hidden></div>
<div class="panel" id="toast" hidden></div>
<div class="panel" id="cameraNote" hidden></div>
<canvas class="panel" id="minimap" hidden aria-label="map"></canvas>
<div class="panel" id="help" hidden>
  drive <span>W A S D</span> · shop <span>B</span> · camera <span>drag</span> orbit / <span>wheel</span> zoom ·
  <span>V</span> camera mode · <span>C</span> reset camera · <span>M</span> mute · <span>H</span> horn<b
    id="helpScoop"
    hidden
  >
    · <span>Space</span> scoop · <span>E</span> tip</b
  ><br />
  push the coins and gems into the hole to bank them
</div>
<div class="panel" id="shop" hidden>
  <h2>
    Workshop<span class="balance">balance <b id="shopBalance">0</b></span>
  </h2>
  <div class="rows"></div>
  <h2 class="later">Paint shop</h2>
  <div class="rows cosmetics"></div>
  <div class="foot">
    <span
      ><span id="shopProgress"></span><span class="keys"> · press <b>B</b> to close</span></span
    >
    <button id="reset" type="button">start over</button>
  </div>
</div>
<div id="pad" hidden>
  <button id="muteButton" type="button" aria-label="mute">🔊</button>
  <button id="cameraButton" type="button" aria-label="camera">🎥</button>
  <button id="shopButton" type="button">shop</button>
  <button id="controlsButton" type="button" aria-label="switch controls">⇅⇅</button>
  <button id="hornButton" type="button" aria-label="horn" hidden>📯</button>
  <button id="scoopButton" type="button" aria-label="raise the scoop" hidden>🪣</button>
  <button id="tipButton" type="button" aria-label="tip the scoop out" hidden>⤵</button>
</div>
<div id="tracks" hidden>
  <div class="track" id="trackLeft" aria-label="left track"><div class="thumb"></div></div>
  <div class="track" id="trackRight" aria-label="right track"><div class="thumb"></div></div>
  <div class="track across" id="steer" aria-label="steering" hidden><div class="thumb"></div></div>
</div>
<div id="boot">
  <h1>PUSHMINER</h1>
  <p id="bootMsg">starting WebGPU…</p>
</div>
<script type="module" src="/src/main.ts"></script>
